repos:
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt

  # Local hooks re-run on .rs and on the .toml files that carry lint config
  # (Cargo.toml, clippy.toml, rustfmt.toml). Lint flags live in the justfile and
  # Cargo.toml so this hook cannot drift from `just ci`. The CPU-only test, the
  # `-D warnings` docs and the cargo-hack check are slower and run only in `just ci`.
  - repo: local
    hooks:
      - id: clippy
        name: clippy
        entry: just lint
        language: system
        files: '\.(rs|toml)$'
        pass_filenames: false

      - id: check-fallbacks
        name: check silent fallbacks
        entry: ./scripts/check-fallbacks.sh
        language: system
        types: [rust]
        pass_filenames: false

      # The format half only: the issue half needs network, and runs in `just ci` and CI.
      - id: check-ignores
        name: check ignored tests carry a defect ID
        entry: ./scripts/check-ignores.sh --offline
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        files: '\.(rs|toml)$'
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
