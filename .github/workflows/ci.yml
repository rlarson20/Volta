name: CI
on:
  push:
    branches: [main, improvements]
  pull_request:

permissions:
  contents: read

# A superseded push to a PR branch is cancelled (it would otherwise hold a scarce macOS
# runner); runs on main and improvements always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each step calls the justfile recipe that `just ci` uses, so local and CI checks cannot drift.

jobs:
  # Honest "no default features" lane. Everything here is CPU-only; the `gpu`
  # feature is excluded from every step (wgpu is heavy and cannot run on
  # GPU-less Linux runners). GPU wrappers have not-gpu stubs at their definition
  # (ADDENDUM §9), so call sites carry no `cfg` and this lane's clippy is clean.
  cpu-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: [1.89, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy, rust-src
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-hack,just

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Check silent fallbacks
        run: just check-fallbacks

      - name: Clippy (no default features)
        run: just lint-cpu

      - name: Test (no default features)
        run: just test-cpu

      - name: Build docs (no default features)
        run: just doc-cpu

      # Feature-combination rot check. `--feature-powerset` includes the
      # empty-feature-set compile that would have caught B5. `gpu` is
      # deliberately excluded on Linux.
      - name: cargo-hack feature powerset (no gpu)
        run: just hack --exclude-features gpu

  # Default features (gpu) on Linux, with Mesa's lavapipe as the adapter: a software
  # Vulkan device (shaderFloat16), so the gpu-gated tests run on every PR, including the
  # f16/bf16 GPU tests and the naga validation of every shader expansion. Not Metal: the
  # macOS lane stays the Apple-GPU check. VOLTA_REQUIRE_GPU makes a missing adapter fail
  # the run instead of letting every GPU test skip.
  linux-lavapipe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install lavapipe
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - name: Test (default features, GPU on lavapipe)
        env:
          VOLTA_REQUIRE_GPU: "1"
        run: cargo test

  # Full build with gpu + accelerate. GitHub's macos-latest is Apple Silicon
  # with a working Metal GPU; GPU tests self-skip at runtime when no adapter
  # is available (src/gpu/mod.rs). Stable only: GitHub's macOS runners are scarce, and
  # the MSRV (1.89) is checked by the `cpu-only` lane. The one-entry matrix keeps the
  # check name `macos (stable)` that the rulesets require.
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy, rust-src
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-hack,just

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # `just lint` runs default features (gpu + accelerate, i.e. all features) and then
      # no default features.
      - name: Clippy
        run: just lint

      - name: Test (all features)
        env:
          # The runner has a Metal GPU; a missing adapter fails instead of skipping.
          VOLTA_REQUIRE_GPU: "1"
        run: cargo test --all-features

      - name: Build docs (all features)
        run: just doc

      - name: cargo-hack feature powerset
        run: just hack
