name: CI
on:
  push:
    branches: [main, improvements]
  pull_request:

permissions:
  contents: read

# A superseded push to a PR branch is cancelled; runs on main and improvements always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each step calls the justfile recipe that `just ci` uses, so local and CI checks cannot drift.

jobs:
  # Honest "no default features" lane. Everything here is CPU-only; the `gpu`
  # feature is excluded from every step (wgpu is heavy and cannot run on
  # GPU-less Linux runners). GPU wrappers have not-gpu stubs at their definition
  # (ADDENDUM §9), so call sites carry no `cfg` and this lane's clippy is clean.
  cpu-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: [1.89, stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy, rust-src
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-hack,just

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Check silent fallbacks
        run: just check-fallbacks

      - name: Clippy (no default features)
        run: just lint-cpu

      - name: Test (no default features)
        run: just test-cpu

      - name: Build docs (no default features)
        run: just doc-cpu

      # Feature-combination rot check. `--feature-powerset` includes the
      # empty-feature-set compile that would have caught B5. `gpu` is
      # deliberately excluded on Linux.
      - name: cargo-hack feature powerset (no gpu)
        run: just hack --exclude-features gpu

  # Every `#[ignore]` names a defect ID with an open issue (scripts/check-ignores.sh). Its own
  # job, apart from the build lanes: it reads GitHub issues, needs no toolchain, and its result
  # depends on issue state rather than on the code alone. VOLTA_REQUIRE_GH makes an unreachable
  # issue list fail instead of skipping.
  ignore-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: just

      - name: Self-test the check
        run: just test-check-ignores

      - name: Check ignored tests name open issues
        env:
          GH_TOKEN: ${{ github.token }}
          VOLTA_REQUIRE_GH: "1"
        run: just check-ignores

  # Runs the quick, data-free examples (scripts/examples-smoke.sh): each must exit 0 within its
  # time limit, print no NaN/inf, and pass its own final-loss assertion. clippy only builds
  # them. Its own job, so a broken example reports apart from the build lanes.
  examples-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Examples smoke run
        run: just examples-smoke

  # Default features (gpu) on Linux, with Mesa's lavapipe as the adapter: a software
  # Vulkan device (shaderFloat16), so the gpu-gated tests run on every PR, including the
  # f16/bf16 GPU tests and the naga validation of every shader expansion. Not Metal: the
  # `macos` job (macos.yml) stays the Apple-GPU check. VOLTA_REQUIRE_GPU makes a missing adapter fail
  # the run instead of letting every GPU test skip.
  linux-lavapipe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install lavapipe
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - name: Test (default features, GPU on lavapipe)
        env:
          VOLTA_REQUIRE_GPU: "1"
        run: cargo test

  # The macOS build, type-checked from Linux: clippy (all features, then none), rustdoc and the
  # feature powerset for aarch64-apple-darwin, which covers the Accelerate matmul path, the Metal
  # backend's dependencies and the macos cfgs. Required on every PR, in place of a macOS runner
  # (scarce, slow to queue). Running Metal and Accelerate is the `macos` job in macos.yml:
  # required into main, post-merge on improvements (DECISIONS.md, "macOS checks move off the PR
  # gate"). ubuntu-latest ships clang, which compiles the one C build script (see the justfile).
  macos-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
          components: clippy, rust-src
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-hack,just
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Clippy (aarch64-apple-darwin)
        run: just lint-macos-cross

      - name: Build docs (aarch64-apple-darwin)
        run: just doc-macos-cross

      - name: cargo-hack feature powerset (aarch64-apple-darwin)
        run: just hack-macos-cross
