name: Dependency Audit
on:
  # Dependency changes are checked in the PR; the schedule catches new advisories on old locks.
  pull_request:
    paths: [Cargo.toml, Cargo.lock, deny.toml, .github/workflows/audit.yml]
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday
  workflow_dispatch: # Manual trigger

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  # A scheduled failure is open work, so it becomes an issue (#258); without this a weekly or
  # nightly job just goes red where nobody looks. Not `merge-gate`: only macOS gates main.
  report-failure:
    needs: audit
    if: always() && needs.audit.result == 'failure' && github.event_name == 'schedule'
    permissions:
      actions: read
      issues: write
    uses: ./.github/workflows/report-failure.yml
    with:
      title: "Dependency Audit scheduled failure on ${{ github.ref_name }}"
      labels: kind:bug,area:ci,P1
      workflow: audit.yml
      details: >-
        `cargo deny check` failed: a new advisory, a yanked crate or a license change in the locked dependencies. Reproduce with `cargo deny check`.
