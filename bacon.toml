#:schema https://dystroy.org/bacon/.bacon.schema.json

# Bacon config. Lint levels live in Cargo.toml [lints] and clippy.toml; this file only picks
# what to run. Jobs not defined here (check, test, doc, run, ...) come from bacon's defaults.
# Docs: https://dystroy.org/bacon/config/

default_job = "clippy"
env.CARGO_TERM_COLOR = "always"

# Same lints as `just lint`, without -D so warnings stay readable.
[jobs.clippy]
command = ["cargo", "clippy", "--all-targets"]
need_stdout = false

# Exploratory: everything in clippy::pedantic on top of the Cargo.toml set. Not a gate.
# The casts and `needless_pass_by_value` are left on to show the work still open (notes/TODO.md).
[jobs.pedantic]
command = [
    "cargo",
    "clippy",
    "--all-targets",
    "--",
    "-W",
    "clippy::pedantic",
    "-A",
    "clippy::similar_names",
    "-A",
    "clippy::many_single_char_names",
    "-A",
    "clippy::too_many_lines",
    "-A",                                         # messes with underscore used for recursion-only parameter lint
    "clippy::used_underscore_binding",
]
need_stdout = false

[jobs.nextest]
command = [
    "cargo",
    "nextest",
    "run",
    "--hide-progress-bar",
    "--failure-output",
    "final",
]
need_stdout = true
analyzer = "nextest"

# One job per clippy group, for triaging a single category at a time.
[jobs.perf]
command = ["cargo", "clippy", "--", "-D", "clippy::perf"]
need_stdout = false

[jobs.correctness]
command = ["cargo", "clippy", "--", "-D", "clippy::correctness"]
need_stdout = false

[jobs.suspicious]
command = ["cargo", "clippy", "--", "-D", "clippy::suspicious"]
need_stdout = false

[jobs.style]
command = ["cargo", "clippy", "--", "-D", "clippy::style"]
need_stdout = false

[jobs.complexity]
command = ["cargo", "clippy", "--", "-D", "clippy::complexity"]
need_stdout = false

[jobs.nursery]
command = ["cargo", "clippy", "--", "-D", "clippy::nursery"]
need_stdout = false

[jobs.cargo]
command = ["cargo", "clippy", "--", "-D", "clippy::cargo"]
need_stdout = false

[keybindings]
p = "job:pedantic"
