# cargo-deny configuration. Run with `just deny` or `cargo deny check`.

[graph]
# Check the whole tree, including the platform-specific targets (windows, wasm).
all-features = true

[advisories]
# Fail on any RustSec advisory, including unmaintained crates, unless it is
# listed in `ignore` below with a reason.
unmaintained = "all"
yanked = "deny"
# Each ignore needs a reason and a way out.
ignore = [
    # `paste` comes in through wgpu-hal -> metal, so only a wgpu upgrade removes it.
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; transitive via wgpu-hal -> metal" },
]

[licenses]
# Permissive licenses only. `r-efi` is `MIT OR Apache-2.0 OR LGPL-2.1-or-later`,
# so it is satisfied by the MIT arm and LGPL stays off this list.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions come from wgpu's and rand's dependency trees; surface them
# without failing the build.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
