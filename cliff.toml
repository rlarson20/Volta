# git-cliff config: drafts CHANGELOG.md sections from commit subjects.
# The draft is a starting point. A person edits it before release (see #455).
#   git cliff v0.3.0.. --tag v0.4.0 --output draft.md

[changelog]
header = ""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## [Unreleased]{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for c in commits %}- {% if c.scope %}**{{ c.scope }}:** {% endif %}{% if c.breaking %}[**breaking**] {% endif %}{{ c.message | split(pat="\n") | first | upper_first | trim }}{% if c.message is not containing("(#") %} ({{ c.id | truncate(length=7, end="") }}){% endif %}
{% endfor %}{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Keep subjects that aren't conventional; they land in "Other" for the edit pass.
filter_unconventional = false
split_commits = false
filter_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^refactor", group = "<!-- 1 -->Changed" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^(docs|test|tests|ci|chore|build|bench|style)", skip = true },
  { message = ".*", group = "<!-- 9 -->Other" },
]
